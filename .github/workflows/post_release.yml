name: EricGameLauncher-PostRelease

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare_release:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Show release preparation message
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const {owner, repo} = context.repo;
            const release = context.payload.release;
            if (!release?.id || !release.tag_name.startsWith('v')) throw new Error('Missing release identity.');
            const {data: current} = await github.rest.repos.getRelease({owner, repo, release_id: release.id});
            if (current.id !== release.id || current.tag_name !== release.tag_name || current.published_at !== release.published_at || current.draft) throw new Error('Release state changed; refusing to replace body.');
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body: '正在构建，稍后将在此显示更新日志和软件包'});
  build:
    needs: prepare_release
    uses: ./.github/workflows/build_release.yml
    with:
      tag: ${{ github.event.release.tag_name }}
  upload_asset:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download this run's release package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/egl-release-package
      - name: Upload package to matching Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PACKAGE_PATH: ${{ runner.temp }}/egl-release-package/${{ needs.build.outputs.package_name }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const release = context.payload.release;
            if (!release?.id || !release.tag_name.startsWith('v')) throw new Error('Missing release identity.');
            const guard = async () => {
              const {data: current} = await github.rest.repos.getRelease({owner, repo, release_id: release.id});
              if (current.id !== release.id || current.tag_name !== release.tag_name || current.published_at !== release.published_at || current.draft) throw new Error('Release state changed; refusing asset upload.');
            };
            await guard();
            const file = process.env.PACKAGE_PATH;
            const name = require('path').basename(file);
            const data = require('fs').readFileSync(file);
            if (!data.length || !name.endsWith('.zip')) throw new Error('Missing release package.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner, repo, release_id: release.id, per_page: 100});
            for (const asset of assets.filter(asset => asset.name === name)) {
              await guard();
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
            }
            await guard();
            await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data, headers: {'content-type': 'application/zip', 'content-length': data.length}});
            await guard();
  publish_notes:
    needs: upload_asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Publish final release notes after asset upload
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const {owner, repo} = context.repo;
            const release = context.payload.release;
            if (!release?.id || !release.tag_name.startsWith('v')) throw new Error('Missing release identity.');
            const {data: current} = await github.rest.repos.getRelease({owner, repo, release_id: release.id});
            if (current.id !== release.id || current.tag_name !== release.tag_name || current.published_at !== release.published_at || current.draft) throw new Error('Release state changed; refusing to publish notes.');
            const body = require('fs').readFileSync('.releasenote.md', 'utf8');
            if (!body.trim()) throw new Error('Tagged release notes are empty.');
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body});
  draft_failed_release:
    needs: [prepare_release, build, upload_asset, publish_notes]
    if: ${{ always() && startsWith(github.event.release.tag_name, 'v') && (needs.prepare_release.result != 'success' || needs.build.result != 'success' || needs.upload_asset.result != 'success' || needs.publish_notes.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Return failed release to draft
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const {owner, repo} = context.repo;
            const release = context.payload.release;
            if (!release?.id || !release.tag_name.startsWith('v')) throw new Error('Missing release identity.');
            let current;
            try {
              current = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
            } catch (error) {
              if (error.status === 404) { core.info('Release was already removed.'); return; }
              throw error;
            }
            if (current.id !== release.id || current.tag_name !== release.tag_name) throw new Error('Release identity changed; refusing to change draft state.');
            if (current.draft) { core.info('Release is already a draft.'); return; }
            if (current.published_at !== release.published_at) {
              core.info('Release has been republished; ignoring this older failed run.');
              return;
            }
            const {data: draft} = await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: true});
            if (!draft.draft) throw new Error('Release did not return to draft state.');
            core.info(`Returned failed release ${release.tag_name} to draft; description, assets, tag and Actions reports retained.`);
