name: Promote Prerelease to Latest

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote Prereleases older than 48 hours
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 20 });
            
            if (!releases.length) {
              console.log("No releases found.");
              return;
            }
            
            const latestRelease = releases[0];
            if (!latestRelease.prerelease) {
              console.log(`Latest release ${latestRelease.tag_name} is already latest. Skipping.`);
              return;
            }
            
            const latestPre = latestRelease;
            
            if (latestPre && latestPre.published_at) {
              if (latestPre.body && latestPre.body.toLowerCase().includes('[no-release]')) {
                console.log(`Skipping latest prerelease ${latestPre.tag_name} due to [no-release] tag.`);
              } else {
                const publishedAt = new Date(latestPre.published_at);
                const hoursSincePublish = (now - publishedAt) / (1000 * 60 * 60);
                
                if (hoursSincePublish >= 48) {
                  const expectedAsset = 'EricGameLauncher_' + latestPre.tag_name.replace(/^v/, '') + '.zip';
                  if (!(latestPre.assets || []).some(asset => asset.name === expectedAsset && asset.size > 0)) {
                    console.log('Promotion blocked: release package is missing.');
                    return;
                  }
                  const ref = await github.rest.git.getRef({owner, repo, ref: 'tags/' + latestPre.tag_name});
                  let sha = ref.data.object.sha;
                  if (ref.data.object.type === 'tag') sha = (await github.rest.git.getTag({owner, repo, tag_sha: sha})).data.object.sha;
                  const {data: runs} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'post_release.yml', head_sha: sha, per_page: 100});
                  const latestRun = runs.workflow_runs.filter(run => run.event === 'release' && run.head_sha === sha)
                    .sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt || b.id - a.id)[0];
                  if (!latestRun || latestRun.status !== 'completed' || latestRun.conclusion !== 'success') {
                    console.log('Promotion blocked: latest release pipeline for this commit has not succeeded.');
                    return;
                  }
                  const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'block-release', per_page: 100});
                  if (issues.length) { console.log('Promotion blocked by block-release issue.'); return; }
                  console.log(`Promoting release ${latestPre.tag_name} to latest`);
                  await github.rest.repos.updateRelease({
                    owner,
                    repo,
                    release_id: latestPre.id,
                    prerelease: false,
                    make_latest: "true"
                  });
                } else {
                  console.log(`Latest prerelease ${latestPre.tag_name} has not reached 48 hours yet (${hoursSincePublish.toFixed(1)}h).`);
                }
              }
            } else {
              console.log("No prerelease found.");
            }
