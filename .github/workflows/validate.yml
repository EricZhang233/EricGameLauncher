name: Validate
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to validate'
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Prepare Windows App Runtime for machine tests
        timeout-minutes: 5
        shell: pwsh
        run: ./Test/Scripts/prepare-runtime.ps1
      - name: Run complete machine tests
        shell: pwsh
        run: dotnet test -warnaserror --logger trx --results-directory Test/artifacts/results
      - name: Upload machine-test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: machine-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: Test/artifacts/
          if-no-files-found: warn
          retention-days: 14
