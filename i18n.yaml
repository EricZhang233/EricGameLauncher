  Privacy_MenuTitle: "隐私/权限"
  Privacy_DialogTitle: "隐私政策与权限说明"
  Privacy_DialogContent: "【隐私声明】\n本应用程序不会收集或上传个人身份、账号、游戏库等隐私信息。所有配置与缓存原则上仅保存在本地。\n\n【权限与用途说明】\n1. 存储与注册表访问\n  • 游戏扫描：读取本地磁盘与注册表，定位已安装游戏目录并解析本地清单（如 AppxManifest）。\n  • 缓存管理：提取游戏执行文件或快捷方式图标并保存至本地，以提升加载性能。\n2. 进程控制与执行\n  • 程序启动：根据您的操作，启动游戏进程、平台协议（如 steam://）或自定义脚本。\n  • 权限提升：仅在您明确启用时，使用管理员权限 (RunAs) 启动。\n  • 组件运行：执行应用更新时，会在系统临时目录释放并运行更新组件。\n3. 网络访问（不上传隐私数据）\n  • 版本更新：与 GitHub 等开源平台建立单向连接，获取版本与更新信息。\n  • 分类校验：本地特征不足时，仅发送应用的 UWP 包名 (PFN) 至微软官方接口验证分类。该过程为单向，不包含第三方追踪、分析或隐私数据上传。\n\n【云控系统】\n部分应用配置由云端开发团队管理。以下是云控项，未列出的配置不受云控。\n  • 强制更新：作为独立能力，仅在紧急情况（T0 级别严重事故、关键安全/稳定修复）启用。我们鼓励用户主动更新，强制更新为最后手段并尽量降低对用户的影响。"
  Privacy_DialogClose: "关闭"
