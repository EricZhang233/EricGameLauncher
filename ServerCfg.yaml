forceUpdate:
  minVersion: "1.0.20.1"
announcements:
  # 未发布的示例公告（仅供参考，不会被客户端显示）
  - id: "example-unpublished-001"   # 用途：公告唯一 ID；类型：string
    title_zh: |
      示例：未发布公告    # 用途：中文标题；类型：string
    title_en: |
      Example: Unpublished Announcement  # 用途：英文标题；类型：string
    body_zh: |
      这是一个示例公告，设置为不可见（visible: false），仅用于说明配置格式。
      # 注意：正文内可包含引号、冒号或 # 符号，块标量会保留原文不需额外转义。
    body_en: |
      This is a sample announcement set to invisible (visible: false) for format demonstration.
      # Note: block scalar preserves quotes, colons and # characters without escaping.
    time: "2026-05-20T12:00:00Z"      # 用途：记录生成或更新时间；类型：ISO8601 字符串
    pinned: false                      # 用途：是否置顶在前；类型：bool
    visible: false                     # 用途：服务器端是否对外发布；类型：bool（false 表示不发布）
    publishAt: null                    # 用途：计划发布时间；类型：ISO8601 字符串 或 null（null 表示不排期）
  # 以下为测试用公告示例（客户端应按 visible 与 publishAt 决定是否显示）
  - id: "test-published-001"
    title_zh: |
      测试公告：已发布
    title_en: |
      Test Announcement: Published
    body_zh: |
      这是一条用于测试的已发布公告，应该立即在客户端显示。
      请确认标题、正文与已读逻辑工作正常。
    body_en: |
      This is a test announcement marked as published and should appear immediately in client.
      Please verify title, body and read-state behavior.
    time: "2026-05-20T08:00:00Z"
    pinned: false
    visible: true
    publishAt: "2026-05-20T08:00:00Z"

  - id: "test-pinned-002"
    title_zh: |
      测试公告：置顶
    title_en: |
      Test Announcement: Pinned
    body_zh: |
      这是一个置顶测试公告，应显示在列表顶部并带有置顶标识。
    body_en: |
      This is a pinned announcement for testing and should appear at the top with a pin indicator.
    time: "2026-05-19T16:00:00Z"
    pinned: true
    visible: true
    publishAt: "2026-05-19T16:00:00Z"

  - id: "test-scheduled-003"
    title_zh: |
      测试公告：定时发布
    title_en: |
      Test Announcement: Scheduled
    body_zh: |
      这条公告设置了将来发布时间，客户端在当前时间之前不应显示。
    body_en: |
      This announcement is scheduled for future publish time and should not be visible before that time.
    time: "2026-05-20T09:00:00Z"
    pinned: false
    visible: true
    publishAt: "2026-05-25T08:00:00Z"

  - id: "test-rich-004"
    title_zh: |
      测试公告：富文本/特殊字符
    title_en: |
      Test Announcement: Rich Content / Special Chars
    body_zh: |
      正文包含多行、引号、冒号与代码片段：
      - 引号示例: "双引号" 与 '单引号'
      - 命令示例: dotnet --version
      - 链接示例: https://example.com
      请确认块标量能正确保留这些字符。
    body_en: |
      Body contains multiple lines, quotes, colons and a code snippet:
      - Quotes: "double quotes" and 'single quotes'
      - Command example: dotnet --version
      - Link example: https://example.com
      Ensure block scalar preserves these characters as-is.
    time: "2026-05-20T10:00:00Z"
    pinned: false
    visible: true
    publishAt: "2026-05-20T10:00:00Z"
