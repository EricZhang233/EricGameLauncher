  - id: "welcome-1"
    title_zh: |
      欢迎使用EricGameLauncher
    title_en: |
      Welcome to EricGameLauncher
    body_zh: |
      感谢您选择EricGameLauncher！我们致力于为您提供最佳的游戏启动器一站式体验。
      - 访问我们的Github项目主页：https://github.com/EricZhang233/EricGameLauncher
      - 有问题\建议？欢迎提交issue：https://github.com/EricZhang233/EricGameLauncher/issues
      我们致力于打造一个轻量并功能强大的游戏启动器，祝您游戏愉快！
    body_en: |
      Thank you for choosing EricGameLauncher! We are committed to providing you with the best all-in-one experience for your game launcher.
      - Visit our Github project page: https://github.com/EricZhang233/EricGameLauncher
      - Questions\Suggestions? Feel free to submit an issue: https://github.com/EricZhang233/EricGameLauncher/issues
      We strive to create a lightweight yet powerful game launcher. Enjoy your gaming!
    time: "2026-05-26T00:00:00Z"
    position: top
    visible: true

  - id: "config-breaking-update-1"
    title_zh: |
      关于此版本的配置文件格式变更的公告
    title_en: |
      Announcement about the configuration file format change in this version
    body_zh: |
      在更新到1.1.0版本后，配置文件格式发生了重大变更。请注意以下事项：
      旧版本的配置文件将不再兼容。
      由于前期调研和本地我们看到的用户规模显示，目前用户规模较小，此时进行一次破坏性更新，虽然会给部分用户带来不便，但从长远来看是必要的，以便我们能够引入更好的设计和功能。
      由于用户环境中配置文件不尽相同，我们无法提供自动迁移工具。请您更新此版本后，手动重新配置您的设置。
      你可以在github中的历史release中下载1.0.20.1版本的安装包，以便继续使用旧版本，直到你准备好迁移到新版本。但请注意，旧版本将不再接收更新和支持。
      我们建议您尽快迁移到新版本，以享受更好的性能和更多的功能。感谢您的理解和支持！
    body_en: |
      After updating to version 1.1.0, there will be a significant change in the configuration file format. Please note the following:
      The old version of the configuration file will no longer be compatible.
      Given our preliminary research and the user scale we have observed locally, which indicates a relatively small user base, we believe that implementing a breaking update at this time, while it may cause inconvenience for some users, is necessary in the long run to allow us to introduce better designs and features.
      Due to the varying configurations in user environments, we are unable to provide an automatic migration tool. Please manually reconfigure your settings after updating to this version.
      You can download the installation package for version 1.0.20.1 from our GitHub releases page to continue using the old version until you are ready to migrate to the new version. Please note that the old version will no longer receive updates or support.
      We recommend migrating to the new version as soon as possible to enjoy improved performance and additional features. Thank you for your understanding and support!
    time: "2026-05-26T00:00:00Z"
    position: normal
    visible: true

