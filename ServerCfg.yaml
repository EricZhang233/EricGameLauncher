  - id: "RoadMap-260629"
    title_zh: |
      开发路线图
    title_en: |
      Development Roadmap
    body_zh: |
      1、持续优化性能及用户体验。
      2、我们持续探索更轻量、更高效的启动器呈现方式。比如在 Windows 上实现类似 macOS 的 Dock 式快捷启动形态——目前已发现一些优质的开源实现，正在评估和适配中。
      3、未来可能引入更多布局选项：图标网格（已支持）、列表（适合 Dock 形态）、卡片（需解决头图获取与适配）等，甚至开放自定义布局，以适应不同用户的审美与操作习惯。

      以上仅为当前阶段的初步设想，不承诺一定实现、也不保证按此顺序推进。具体优先级将根据用户反馈和实际情况动态调整。
      如有新功能或改进建议，欢迎在 GitHub 提交 Issue，我们会认真评估并尽力落实。
    body_en: |
      -1- Continuously optimizing performance and user experience.
      -2- We are continuously exploring lighter and more efficient launcher presentation solutions. (Perhaps implementing a Dock-style folder layout similar to macOS on Windows? We have already seen other high-quality open-source projects achieve the effect we desire, and we are currently evaluating and adapting it...)
      -3- Building on the previous point, we may introduce more layout options, such as icon grids (already implemented), lists (recommended for Dock-style layouts), cards (considering how to obtain header images and adapt), and even custom layouts to cater to different user habits and aesthetic preferences.

      This is just our preliminary plan; it may not be implemented or followed in order. It represents our current thoughts and plans, which may change and adjust in the future. We will prioritize development based on user feedback and actual circumstances.
      If you have any new feature or improvement suggestions, please feel free to submit an issue on Github, and we will carefully consider and strive to implement them.
    time: "2026-06-01T00:00:40Z"
    position: top
    visible: true

  - id: "outdated-versions-1"
    title_zh: |
      过时版本列表
    title_en: |
      Outdated Versions list
