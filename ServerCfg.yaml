forceUpdate:
  minVersion: "1.0.20.1"

announcements:
  # 块标量会保留换行与特殊字符，适合多行正文；行标量需要对特殊字符做适当转义。
  # Block scalars preserve newlines and special characters for multi-line text; plain scalars need proper escaping for special characters.
  # 示例公告（仅供参考，不会被客户端显示）
  - id: "example"   # string
    title_zh: | # multiline string
      示例：未发布公告
    title_en: | # multiline string
      Example: Unpublished Announcement
    body_zh: | # multiline string
      这是一个示例公告，仅用于说明配置格式。
    body_en: | # multiline string
      This is a sample announcement for format demonstration.
    time: "2026-05-20T00:00:00Z" # ISO8601, e.g. 2026-05-20T12:00:00Z
    position: normal # enum: normal | top | bottom
    visible: false # bool (true | false)
  # 示例公告结束
  - id: "test-top-001"
    title_zh: |
      测试公告：置顶通知
    title_en: |
      Test Announcement: Top Notice
    body_zh: |
      这是一条置顶测试公告，用来验证顶部优先级、固定标识和列表排序。
    body_en: |
      This test announcement verifies top priority, marker display, and list ordering.
    time: "2026-05-20T00:00:00Z"
    position: top
    visible: true

  - id: "test-special-002"
    title_zh: |
      测试公告：特殊字符
    title_en: |
      Test Announcement: Special Characters
    body_zh: |
      这条测试公告包含引号、冒号、# 和 URL：https://example.com
      用来验证普通标量与块标量在特殊字符场景下的表现。
    body_en: |
      This test announcement includes quotes, colons, #, and a URL: https://example.com
      It verifies how scalars behave with special characters.
    time: "2026-05-20T00:00:00Z"
    position: normal
    visible: true

  - id: "test-scheduled-003"
    title_zh: |
      测试公告：定时发布
    title_en: |
      Test Announcement: Scheduled Release
    body_zh: |
      这条公告设置在未来时间发布，客户端在到达发布时间前不应显示。
    body_en: |
      This announcement is scheduled for a future time and should not be visible before release.
    time: "2026-05-20T00:00:00Z"
    position: normal
    visible: true

  - id: "test-bottom-004"
    title_zh: |
      测试公告：置底说明
    title_en: |
      Test Announcement: Bottom Note
    body_zh: |
      这是一条置底测试公告，用来验证底部排序和向下标识。
    body_en: |
      This test announcement verifies bottom ordering and the down marker.
    time: "2026-05-20T00:00:00Z"
    position: bottom
    visible: true
