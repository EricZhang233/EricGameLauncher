  Help_CmdSkillDesc: "  skill          Print the AI agent integration guide"
  Help_CmdVersionDesc: "  version        Display version information"
  Help_CmdHelpDesc: "  help           Show this help message"
  Help_GlobalOptionsHeader: "Global Options:"
  Help_OptionDebug: "  -debug              Enable debug mode"
  Help_OptionHelp: "  --help, -h          Show help for a command"
  Help_OptionJson: "  --json              Output in JSON format"
  Help_Footer: 'Use "EricGameLauncher.Cli.exe <command> --help" for command-specific help.'
  Help_UnknownCmd: 'Use "EricGameLauncher.Cli.exe help" to see available commands.'

  # == Command-Specific Help ==
  Help_List_Text: |
    Usage: EricGameLauncher.Cli.exe list [options]

      --recycle           List recycle bin items
      --json              Output in JSON format
  Help_Launch_Text: |
    Usage: EricGameLauncher.Cli.exe launch [options]

      --id <id>           Launch by item ID
      --title <title>     Launch by title (first match)
      --path <path>       Launch by executable path directly
      --admin             Run as administrator
      --alt               Use alternative launch command
      --alongside         Also run alongside command
  Help_Platform_Text: |
    Usage: EricGameLauncher.Cli.exe platform [options]

      --id <id>           Launch platform manager by item ID
      --title <title>     Launch platform manager by title (first match)
  Help_Add_Text: |
    Usage: EricGameLauncher.Cli.exe add [options]

      --title <title>     Item title (required)
      --path <path>       Executable path (required)
      --admin             Run as administrator
      --icon <path>       Custom icon path
      --platform <name>   Platform name (Steam, Epic, Xbox)
      --mgr <path>        Manager executable path
      --alt <path>        Alternative launch command
      --alongside <path>  Alongside launch command
  Help_Edit_Text: |
    Usage: EricGameLauncher.Cli.exe edit [options]

      --id <id>           Edit by item ID (required)
      --title <title>     Set new title
      --path <path>       Set new executable path
      --admin <bool>      Set admin mode (true/false)
      --icon <path>       Set custom icon path
      --platform <name>   Set platform name
      --mgr <path>        Set manager path
      --mgr-admin <bool>  Set manager admin mode
      --alt <path>        Set alternative launch command
      --alt-admin <bool>  Set alt admin mode
      --alt-enable <bool> Enable/disable alternative launch
      --alongside <path>  Set alongside command
      --alongside-admin <bool> Set alongside admin mode
      --alongside-enable <bool> Enable/disable alongside
      --custom-add <title>|<command>|<admin>  Add custom menu item
      --custom-remove <index>  Remove custom menu item by index
      --custom-clear      Remove all custom menu items
  Help_Remove_Text: |
    Usage: EricGameLauncher.Cli.exe remove [options]

      --id <id>           Remove by item ID
      --title <title>     Remove by title (first match)
      --permanent         Permanently delete (skip recycle bin)
  Help_Restore_Text: |
    Usage: EricGameLauncher.Cli.exe restore [options]

      --id <id>           Restore by item ID
      --title <title>     Restore by title (first match)
      --all               Restore all items
  Help_Recycle_Text: |
    Usage: EricGameLauncher.Cli.exe recycle [options]

      --list              List recycle bin items
      --empty             Empty the recycle bin
      --clean             Auto-clean expired items (72h+)
      --json              Output in JSON format
  Help_Scan_Text: |
    Usage: EricGameLauncher.Cli.exe scan [options]

      --steam             Scan Steam games
      --epic              Scan Epic games
      --xbox              Scan Xbox/UWP games
      --all               Scan all platforms (default)
      --classify          Show new/existing/invalid breakdown
      --invalid           Show only invalid (broken) games
      --delete-invalid    Remove all invalid games
      --import            Auto-import all found games
      --json              Output in JSON format
  Help_Search_Text: |
    Usage: EricGameLauncher.Cli.exe search <query> [options]

      <query>             Search keyword
      --json              Output in JSON format
  Help_Settings_Text: |
    Usage: EricGameLauncher.Cli.exe settings [options]

      --list              List all settings
      --get <key>         Get a specific setting
      --set <key>=<value> Set a setting value
      --json              Output in JSON format

    Available settings:
      launchMode          Launch mode (single / double)
      closeAfterLaunch    Auto-close after launch (true / false)
      iconSize            Icon size in pixels (32-512)
      updateChannel       Update channel (stable / latest)
      githubToken         GitHub personal access token
      appIconPath         Custom application icon path
      appTitle            Custom application title
      lang                UI language (Zh-CN / EN)
      storageMode         Storage mode (system / portable)
      windowX             Window X position (-1 = centered)
      windowY             Window Y position (-1 = centered)
      windowWidth         Window width
      windowHeight        Window height
  Help_Update_Text: |
    Usage: EricGameLauncher.Cli.exe update [options]

      --check             Check for available updates
      --channel <ch>      Channel: stable or latest (default: stable)
      --json              Output in JSON format
  Help_Sort_Text: |
    Usage: EricGameLauncher.Cli.exe sort [options]

      --list              List items with current sort order
      --id <id>           Target item ID (for move/swap)
      --move-up           Move item one position up
      --move-down         Move item one position down
      --swap-with <id2>   Swap positions with another item
      --json              Output in JSON format
  Help_Announcements_Text: |
    Usage: EricGameLauncher.Cli.exe announcements [options]

      --list              List active announcements
      --read <id>         Mark announcement as read
      --json              Output in JSON format
  Help_Install_Text: |
    Usage: EricGameLauncher.Cli.exe install

      Creates desktop and start menu shortcuts for EricGameLauncher.
  Help_Uninstall_Text: |
    Usage: EricGameLauncher.Cli.exe uninstall

      Removes desktop and start menu shortcuts for EricGameLauncher.
  Help_Storage_Text: |
    Usage: EricGameLauncher.Cli.exe storage [options]

      --status            Show current storage mode
      --switch <mode>     Switch to system or portable mode
      --json              Output in JSON format
  Help_Skill_Text: |
    Usage: EricGameLauncher.Cli.exe skill

      Prints the AI agent integration guide (CLI usage reference).
  Help_Version_Text: |
    Usage: EricGameLauncher.Cli.exe version

      Displays application version.
