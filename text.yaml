  Migration_OverlaySubTitle: "This may take a few seconds; the app will restart automatically when finished."
  Migration_OverlayTitle: "Upgrading configuration engine..."
  Privacy_DialogClose: "Close"
  Privacy_DialogContent: "【Privacy Statement】\nThis application never collects or secretly uploads your personal identification, account, or game library data. All configurations and caches are stored locally by default.\n\n【Required permissions and usage】\n1. Storage & Registry Access\n  • Game Scanning: Reads local drives and registries to locate installed games and parse local manifests (e.g., AppxManifest).\n  • Cache Management: Extracts executable or shortcut icons and caches them locally to improve load performance.\n2. Process Control & Execution\n  • App Launching: Reacts to your actions by launching game processes, platform protocols (e.g., steam://), or custom scripts.\n  • Permission Elevation: Only enters Administrator (RunAs) mode when explicitly configured by the user.\n  • Component Execution: During application updates, extracts and runs an update component from the system temporary directory.\n3. Network Access (No privacy data upload)\n  • Updates: One-way connection to open-source hosting platforms (e.g., GitHub) to fetch version metadata.\n  • Category Verification: When local data is insufficient, only the app's UWP Package Family Name (PFN) is sent to Microsoft's official interface for category verification. This is a one-way query with no third-party tracking, analytics, or privacy uploads.\n\n【Cloud control system】\nSome in-app configurations are managed by the cloud development team. The following settings are cloud-managed; settings not listed are not.\n  • Forced update: An independent capability enabled for critical T0 incidents and key security/stability fixes. Voluntary updates are encouraged; forced updates are a last resort and minimize user disruption."
  Privacy_DialogTitle: "Privacy Policy & Permissions"
  Privacy_MenuTitle: "Privacy & Permissions"
